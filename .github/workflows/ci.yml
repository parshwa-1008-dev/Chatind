name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chatind
          POSTGRES_PASSWORD: chatind
          POSTGRES_DB: chatind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatind -d chatind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://chatind:chatind@localhost:5432/chatind?schema=public
      DIRECT_URL: postgresql://chatind:chatind@localhost:5432/chatind?schema=public
      JWT_SECRET: ci-only-secret-please-replace-0123456789
      REFRESH_TOKEN_SECRET: ci-only-refresh-secret-0123456789
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: test
      RUN_DB_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
