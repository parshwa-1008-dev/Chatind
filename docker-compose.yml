services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatind}
      POSTGRES_DB: ${POSTGRES_DB:-chatind}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatind} -d ${POSTGRES_DB:-chatind}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chatind}:${POSTGRES_PASSWORD:-chatind}@db:5432/${POSTGRES_DB:-chatind}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-chatind}:${POSTGRES_PASSWORD:-chatind}@db:5432/${POSTGRES_DB:-chatind}?schema=public
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-/api}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
